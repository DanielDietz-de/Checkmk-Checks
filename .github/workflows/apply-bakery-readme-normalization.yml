name: Apply Bakery README normalization

on:
  push:
    branches:
      - agent/impacted-mkp-ci-publication
    paths:
      - .github/workflows/apply-bakery-readme-normalization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/impacted-mkp-ci-publication
          fetch-depth: 0

      - name: Apply deterministic README normalization
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/normalize_package_sources.py --write
          mapfile -t changed < <(git diff --name-only)
          ((${#changed[@]})) || {
            echo "No README normalization changes were produced" >&2
            exit 1
          }
          for path in "${changed[@]}"; do
            [[ "$path" == */README.md ]] || {
              echo "Normalizer changed unexpected path: $path" >&2
              exit 1
            }
          done
          python3 tools/ci/normalize_package_sources.py

      - name: Commit normalized README paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*/README.md'
          git commit -m "docs: align Bakery paths after source normalization"
          git push origin HEAD:agent/impacted-mkp-ci-publication
