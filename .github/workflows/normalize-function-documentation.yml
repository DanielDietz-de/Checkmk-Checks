name: Normalize newly covered function documentation

on:
  push:
    branches:
      - agent/final-repository-completion-audit
    paths:
      - .github/workflows/normalize-function-documentation.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact bootstrap head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify bootstrap boundary
        env:
          EXPECTED_PARENT: 4bca6cbff3def412fcc18ccf568c39980a47e8ed
          BOOTSTRAP_PATH: .github/workflows/normalize-function-documentation.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          mapfile -t changed < <(git diff --name-only HEAD^ HEAD)
          test "${#changed[@]}" -eq 1 && test "${changed[0]}" = "$BOOTSTRAP_PATH" || {
            printf 'unexpected bootstrap changes:\n' >&2
            printf ' - %s\n' "${changed[@]}" >&2
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Normalize newly covered documentation
        run: python tools/ci/normalize_function_documentation.py

      - name: Validate normalized tree
        run: |
          set -euo pipefail
          python tools/ci/check_function_documentation.py
          python tools/ci/check_python_syntax.py
          python -m pytest -q .github/tests/test_function_documentation_policy.py
          git diff --check

      - name: Commit source documentation updates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- ':!.github/workflows/normalize-function-documentation.yml'
          if git diff --cached --quiet; then
            echo 'No source documentation changes were required.'
            exit 0
          fi
          git commit -m 'docs: complete newly covered function documentation'
          git push origin HEAD:agent/final-repository-completion-audit
