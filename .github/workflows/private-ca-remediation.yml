name: Private CA remediation

on:
  push:
    branches:
      - agent/repository-wide-security-documentation-audit
    paths:
      - .github/scripts/apply_private_ca_policy.py
      - .github/workflows/private-ca-remediation.yml

permissions:
  contents: write

concurrency:
  group: private-ca-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/repository-wide-security-documentation-audit
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Apply consistent private CA policy
        run: python3 .github/scripts/apply_private_ca_policy.py

      - name: Regenerate code-derived documentation
        run: |
          set -euo pipefail
          python3 tools/ci/sync_package_metadata.py --write
          python3 update_readmes.py
          python3 tools/ci/generate_package_reference.py --write
          python3 create_mkp_index.py

      - name: Validate remediation before publication
        run: |
          set -euo pipefail
          python3 tools/ci/check_python_syntax.py
          python3 -m unittest tests.test_ci_private_ca_policy -v
          python3 -m unittest discover -s tests -p 'test_ci_*.py' -v

      - name: Commit remediation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No remediation changes were produced.'
            exit 0
          fi
          git commit -m 'fix: preserve private CA trust consistently'
          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch "$remote_url" agent/repository-wide-security-documentation-audit
          git rebase FETCH_HEAD
          git push "$remote_url" HEAD:agent/repository-wide-security-documentation-audit
