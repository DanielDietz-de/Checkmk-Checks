name: Diagnose current master integration

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/merge-current-master.yml"

permissions:
  contents: read

concurrency:
  group: diagnose-master-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/repository-wide-security-documentation-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out integration checkpoint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply exact master delta with three-way merge
        env:
          EXPECTED_FIRST_PARENT: 1e57cc5472145950570fb5e62ddbfae2932c3837
          EXPECTED_MASTER: 7972e92c2cf612342608bd4f674e2e8f6a9ab8f9
          MERGE_BASE: 5f70214a6070cb4e765cefe4eacf4321ae587617
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_FIRST_PARENT"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_MASTER"
          git diff --binary "$MERGE_BASE" "$EXPECTED_MASTER" > /tmp/current-master.patch
          set +e
          git apply --3way --index /tmp/current-master.patch
          apply_rc=$?
          set -e
          echo "Apply return code: $apply_rc"
          echo "Unmerged paths:"
          git diff --name-only --diff-filter=U || true
          echo "Status:"
          git status --short
          if [ "$apply_rc" -eq 0 ]; then
            echo "Integrated tree before regeneration: $(git write-tree)"
          fi
          exit 1
