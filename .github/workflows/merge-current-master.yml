                  "python3 tools/ci/sync_package_metadata.py\n",
              ),
              Path("docs/REPOSITORY_AUDIT.md"): (
                  "- `tools/ci/sync_package_metadata.py` treats `src/info` as canonical",
                  "- `tools/ci/sync_repository_facts.py` derives repository-level package counts from canonical manifests.\n"
                  "- `tools/ci/sync_package_metadata.py` treats `src/info` as canonical",
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"documentation marker missing in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/repository-guard.yml")
          text = workflow.read_text(encoding="utf-8")
          old = "      - name: Verify canonical metadata mirrors\n        run: python3 tools/ci/sync_package_metadata.py\n"
          new = (
              "      - name: Verify code-derived repository facts\n"
              "        run: python3 tools/ci/sync_repository_facts.py\n\n"
              + old
          )
          if old not in text:
              raise SystemExit("repository guard insertion marker missing")
          workflow.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(find . -mindepth 2 -maxdepth 3 -path '*/src/info' -type f | wc -l)" -eq 97

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1
          requests==2.34.2
          ruff==0.15.22

      - name: Regenerate all code-derived repository state
        run: |
          set -euo pipefail
          python3 tools/ci/sync_package_metadata.py --write
          python3 tools/ci/manage_module_docstrings.py --write
          python3 tools/ci/generate_package_reference.py --write
          python3 create_mkp_index.py
          python3 tools/ci/sync_repository_facts.py --write

      - name: Create exact integrated candidate commit
        run: |
          set -euo pipefail
          rm .github/workflows/merge-current-master.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf .pytest_cache
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          test ! -e .github/workflows/merge-current-master.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "repository: integrate current code and regenerate audited documentation"
          echo "Candidate commit: $(git rev-parse HEAD)"
          echo "Candidate tree: $(git rev-parse 'HEAD^{tree}')"

      - name: Validate exact integrated candidate
        env:
          EXPECTED_MASTER: 7972e92c2cf612342608bd4f674e2e8f6a9ab8f9
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          git merge-base --is-ancestor "$EXPECTED_MASTER" HEAD
          python3 tools/ci/pin_supply_chain.py --check
          python3 tools/ci/repository_guard.py --base "$EXPECTED_MASTER" --head HEAD
          python3 tools/ci/sync_repository_facts.py
          python3 tools/ci/sync_package_metadata.py
          python3 tools/ci/generate_package_reference.py
          python3 tools/ci/manage_module_docstrings.py
          python3 tools/ci/check_python_syntax.py
          python3 tools/ci/full_repository_audit.py \
            --fail-on low \
            --output /tmp/repository-audit.json
          ruff check --select E9,F63,F7,F82 .github/scripts .github/tests create_mkp_index.py tools/ci
          python3 -m pytest -q tests .github/tests */tests
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/repository-audit.json").read_text(encoding="utf-8"))
          assert report["active_packages"] == 97, report
          assert report["summary"]["all"] == {
              "critical": 0,
              "high": 0,
              "medium": 0,
              "low": 0,
          }, report["summary"]
          print(json.dumps(report["summary"], sort_keys=True))
          PY

      - name: Publish exact validated candidate
        run: |
          set -euo pipefail
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
