name: Apply validated Codex findings

on:
  push:
    branches:
      - agent/repository-wide-security-documentation-audit
    paths:
      - .github/workflows/apply-codex-findings.yml

permissions:
  contents: write

concurrency:
  group: apply-codex-findings
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Restore executable mode and regenerate documentation
        run: |
          set -euo pipefail
          chmod 0755 cohesity/src/cohesity/libexec/agent_cohesity
          python3 tools/ci/generate_package_reference.py --write

      - name: Install pinned validation dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          pytest==9.1.1
          requests==2.34.2
          ruff==0.15.22

      - name: Validate remediated tree
        run: |
          set -euo pipefail
          python3 tools/ci/sync_repository_facts.py
          python3 tools/ci/sync_package_metadata.py
          python3 tools/ci/generate_package_reference.py
          python3 tools/ci/manage_module_docstrings.py
          python3 tools/ci/check_python_syntax.py
          python3 tools/ci/full_repository_audit.py
          python3 tools/ci/pin_supply_chain.py --check
          ruff check --select E9,F63,F7,F82 tools/ci tests semu cohesity
          pytest -q tests .github/tests */tests
          python3 .github/scripts/prepare_repository_mkp_release.py --repository .
          rm -rf dist/codex-fixes
          python3 .github/scripts/build_repository_mkps.py \
            --repository . \
            --output dist/codex-fixes \
            --packaged-version 2.5.0p9
          git diff --check
          rm -rf dist/codex-fixes

      - name: Commit validated fixes and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/apply-codex-findings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: resolve Codex publication blockers"
          git push origin HEAD:agent/repository-wide-security-documentation-audit
