name: Repository security and supply-chain guard

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-hitachi-ca-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/repository-wide-security-documentation-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/repository-wide-security-documentation-audit
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply Hitachi private-CA remediation
        run: python3 .github/scripts/apply_hitachi_ca_fix.py

      - name: Validate remediation
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            pytest==9.1.1 \
            requests==2.34.2
          python3 tools/ci/generate_package_reference.py
          python3 tools/ci/manage_module_docstrings.py
          python3 tools/ci/check_python_syntax.py
          python3 tools/ci/full_repository_audit.py --fail-on low
          pytest -q hitachi_hnas_rest/tests
          python3 -m unittest discover -s tests -p 'test_ci_*.py' -v
          git diff --check

      - name: Commit validated Hitachi source and tests
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            hitachi_hnas_rest/README.md \
            hitachi_hnas_rest/src/hitachi_hnas_rest/libexec/agent_hitachi_hnas_rest \
            hitachi_hnas_rest/src/hitachi_hnas_rest/rulesets/agent.py \
            hitachi_hnas_rest/src/hitachi_hnas_rest/server_side_calls/agent.py \
            hitachi_hnas_rest/tests/test_hitachi_hnas_rest_transport.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(hitachi): preserve private CA trust"
          git push origin "HEAD:${TARGET_BRANCH}"

  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned CI test dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          requests==2.34.2

      - name: Verify immutable workflow dependencies
        run: python3 tools/ci/pin_supply_chain.py --check

      - name: Resolve comparison range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
          fi
          printf 'base=%s\nhead=%s\n' "$base" "$head" >>"$GITHUB_OUTPUT"

      - name: Enforce changed-code policy
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: >-
          python3 tools/ci/repository_guard.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

      - name: Verify code-derived repository facts
        run: python3 tools/ci/sync_repository_facts.py

      - name: Verify canonical metadata mirrors
        run: python3 tools/ci/sync_package_metadata.py

      - name: Verify code-derived package documentation
        run: python3 tools/ci/generate_package_reference.py

      - name: Verify package module documentation
        run: python3 tools/ci/manage_module_docstrings.py

      - name: Verify repository Python syntax
        run: python3 tools/ci/check_python_syntax.py

      - name: Audit complete repository
        run: >-
          python3 tools/ci/full_repository_audit.py
          --fail-on low
          --output repository-audit.json

      - name: Create audited source snapshot
        run: git archive --format=zip --output repository-source.zip HEAD

      - name: Upload repository audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-audit
          path: |
            repository-audit.json
            repository-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Test CI guard tools
        run: python3 -m unittest discover -s tests -p 'test_ci_*.py' -v
