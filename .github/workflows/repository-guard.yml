name: Repository security and supply-chain guard

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify immutable workflow dependencies
        run: python3 tools/ci/pin_supply_chain.py --check

      - name: Resolve comparison range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
          fi
          printf 'base=%s\nhead=%s\n' "$base" "$head" >>"$GITHUB_OUTPUT"

      - name: Enforce changed-code baseline
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: >-
          python3 tools/ci/repository_guard.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

      - name: Audit complete repository
        run: >-
          python3 tools/ci/full_repository_audit.py
          --fail-on none
          --output repository-audit.json

      - name: Create audited source snapshot
        run: git archive --format=zip --output repository-source.zip HEAD

      - name: Upload repository audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-audit
          path: |
            repository-audit.json
            repository-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Test CI guard tools
        run: python3 -m unittest discover -s tests -p 'test_ci_*.py' -v
