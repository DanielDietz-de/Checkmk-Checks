name: Final repository audit runner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: final-repository-audit-runner
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out trusted bootstrap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          path: trusted
          persist-credentials: false

      - name: Check out exact staging transport
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: a63b0b2b0b495d316eb506c47cd514f627e746e2
          fetch-depth: 0
          path: work
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 requests==2.34.2 ruff==0.15.22

      - name: Bind runner to recurring schedule merge
        run: |
          set -euo pipefail
          sed -i 's/EXPECTED_PREVIOUS_MASTER = "ebcfaa1c36b7e33c304ec3357f56c85eeb6f0c63"/EXPECTED_PREVIOUS_MASTER = "1fca9af02888187b86614b638f55744ff975824a"/' trusted/.github/scripts/final_audit_runner.py
          sed -i '/".github\/scripts\/final_audit_runner.py",/d' trusted/.github/scripts/final_audit_runner.py
          python -m py_compile trusted/.github/scripts/final_audit_runner.py

      - name: Reconstruct, validate, and publish exact audit tree
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python trusted/.github/scripts/final_audit_runner.py --repository work
