name: Final repository audit runner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - .github/final-audit-kick

permissions:
  actions: write
  contents: write

concurrency:
  group: final-repository-audit-runner
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'Daniel-Dietz' &&
       github.head_ref == 'agent/final-audit-kick' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out trusted bootstrap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          path: trusted
          persist-credentials: false

      - name: Check out exact staging transport
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: a63b0b2b0b495d316eb506c47cd514f627e746e2
          fetch-depth: 0
          path: work
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 requests==2.34.2 ruff==0.15.22

      - name: Verify trusted regeneration bootstrap syntax
        run: >-
          python -m py_compile
          trusted/.github/scripts/final_audit_regenerate_additions.py
          trusted/.github/scripts/final_audit_runner.py

      - name: Regenerate additions entirely from reviewed source
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import importlib.util
          import io
          from pathlib import Path
          import shutil
          import sys
          import tarfile

          bootstrap = Path("trusted/.github/scripts/final_audit_regenerate_additions.py")
          spec = importlib.util.spec_from_file_location("final_audit_regenerate_additions", bootstrap)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load trusted additions regeneration bootstrap")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          finalize_policy_source = r'''#!/usr/bin/env python3
          """Append the permanent function-documentation policy to live repository guidance."""
          from __future__ import annotations

          from pathlib import Path

          MARKER = "## Function-level code documentation"
          ADDITION = (
              "\n\n## Function-level code documentation\n\n"
              "Every tracked function and class must have human-readable code-level documentation. "
              "Run `python tools/ci/check_function_documentation.py` before publication. The gate "
              "covers production code, tests, CI tooling, and retained reference source.\n"
          )


          def append_policy(path: Path) -> None:
              """Append the policy section exactly once to one required repository document."""
              if not path.is_file():
                  raise RuntimeError(f"required policy target is missing: {path}")
              text = path.read_text(encoding="utf-8")
              if MARKER in text:
                  return
              path.write_text(text.rstrip() + ADDITION, encoding="utf-8")


          def main() -> int:
              """Apply the policy to both permanent contributor and maintenance guidance."""
              root = Path.cwd()
              for relative in ("MAINTENANCE.md", "CONTRIBUTING.md"):
                  append_policy(root / relative)
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          '''

          def prepare_source_additions(repository: Path, trusted_root: Path, destination: Path) -> bytes:
              """Build the complete additions bundle from reviewed generators and policy sources."""
              del repository
              runtime = destination / "runtime"
              runtime.mkdir(parents=True, exist_ok=True)
              (runtime / "document_symbols.py").write_text(
                  module.DOCUMENT_SYMBOLS_SOURCE,
                  encoding="utf-8",
              )
              (runtime / "finalize_policy.py").write_text(
                  finalize_policy_source,
                  encoding="utf-8",
              )

              payload = destination / "payload"
              checker = payload / "tools/ci/check_function_documentation.py"
              checker.parent.mkdir(parents=True, exist_ok=True)
              checker.write_text(module.CHECK_FUNCTION_DOCUMENTATION_SOURCE, encoding="utf-8")

              test_path = payload / ".github/tests/test_function_documentation_policy.py"
              test_path.parent.mkdir(parents=True, exist_ok=True)
              test_path.write_text(module.TEST_FUNCTION_DOCUMENTATION_SOURCE, encoding="utf-8")

              docs = payload / "docs/CODE_DOCUMENTATION.md"
              docs.parent.mkdir(parents=True, exist_ok=True)
              docs.write_text(module.CODE_DOCUMENTATION_MD, encoding="utf-8")

              guard = payload / ".github/workflows/repository-guard.yml"
              guard.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(trusted_root / ".github/workflows/repository-guard.yml", guard)
              module.inject_guard_step(guard)

              output = io.BytesIO()
              with tarfile.open(fileobj=output, mode="w:xz", format=tarfile.PAX_FORMAT) as archive:
                  for path in sorted(destination.rglob("*")):
                      relative = path.relative_to(destination).as_posix()
                      info = tarfile.TarInfo(relative)
                      info.uid = 0
                      info.gid = 0
                      info.uname = ""
                      info.gname = ""
                      info.mtime = 0
                      info.mode = path.stat().st_mode & 0o777
                      if path.is_dir():
                          info.type = tarfile.DIRTYPE
                          info.size = 0
                          archive.addfile(info)
                      elif path.is_file():
                          data = path.read_bytes()
                          info.type = tarfile.REGTYPE
                          info.size = len(data)
                          archive.addfile(info, io.BytesIO(data))
                      else:
                          raise RuntimeError(f"unsupported source additions path: {path}")
              rebuilt = output.getvalue()
              module.require(
                  len(rebuilt) <= module.MAX_ADDITIONS_SIZE,
                  "source-regenerated additions archive exceeds size bound",
              )
              return rebuilt

          module.prepare_predecessor_additions = prepare_source_additions
          module.PREDECESSOR_COMMIT = "reviewed-source-regeneration"
          sys.argv = [
              str(bootstrap),
              "--repository", "work",
              "--trusted-root", "trusted",
              "--runner", "trusted/.github/scripts/final_audit_runner.py",
          ]
          result = module.main()
          if result != 0:
              raise SystemExit(result)

          runner = Path("trusted/.github/scripts/final_audit_runner.py")
          source = runner.read_text(encoding="utf-8")
          replacements = {
              '        require(count >= 1600, f"regenerated source tree is unexpectedly small: {count}")':
                  '        require(count == EXPECTED_FILES, f"regenerated source tree file count mismatch: {count} != {EXPECTED_FILES}")',
              '    shutil.copytree(payload, repository, dirs_exist_ok=True, copy_function=shutil.copy2)\n'
              '    run(sys.executable, str(documenter), cwd=repository)\n\n'
              '    run(sys.executable, "tools/ci/sync_package_metadata.py", "--write", cwd=repository)':
                  '    shutil.copytree(payload, repository, dirs_exist_ok=True, copy_function=shutil.copy2)\n'
                  '    finalizer = additions / "runtime/finalize_policy.py"\n'
                  '    require(finalizer.is_file(), "repository policy finalizer is missing")\n'
                  '    run(sys.executable, str(finalizer), cwd=repository)\n'
                  '    run(sys.executable, str(documenter), cwd=repository)\n\n'
                  '    run(sys.executable, "tools/ci/sync_package_metadata.py", "--write", cwd=repository)',
              '    publish(repository, master_sha)\n'
              '    dispatch_workflows(os.environ.get("GITHUB_TOKEN", ""))\n'
              '    return 0':
                  '    if os.environ.get("FINAL_AUDIT_CAPTURE_ONLY") == "1":\n'
                  '        print("Capture-only final audit completed; publication is disabled")\n'
                  '        return 0\n'
                  '    publish(repository, master_sha)\n'
                  '    dispatch_workflows(os.environ.get("GITHUB_TOKEN", ""))\n'
                  '    return 0',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f"source-regeneration runner binding not found exactly once: {old[:100]}")
              source = source.replace(old, new, 1)
          runner.write_text(source, encoding="utf-8")
          PY

      - name: Re-verify trusted runner syntax after binding
        run: python -m py_compile trusted/.github/scripts/final_audit_runner.py

      - name: Reconstruct and validate source-regenerated audit tree
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FINAL_AUDIT_CAPTURE_ONLY: "1"
        run: python trusted/.github/scripts/final_audit_runner.py --repository work
