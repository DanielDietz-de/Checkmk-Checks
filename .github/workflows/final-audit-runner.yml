name: Final repository audit runner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - .github/final-audit-kick

permissions:
  actions: write
  contents: write

concurrency:
  group: final-repository-audit-runner
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == 'Daniel-Dietz' &&
       github.head_ref == 'agent/final-audit-kick' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out trusted bootstrap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          path: trusted
          persist-credentials: false

      - name: Check out exact staging transport
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: a63b0b2b0b495d316eb506c47cd514f627e746e2
          fetch-depth: 0
          path: work
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 requests==2.34.2 ruff==0.15.22

      - name: Verify trusted regeneration bootstrap syntax
        run: >-
          python -m py_compile
          trusted/.github/scripts/final_audit_regenerate_additions.py
          trusted/.github/scripts/final_audit_runner.py

      - name: Regenerate additions from complete tar before corrupt XZ tail
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import binascii
          import importlib.util
          import io
          import lzma
          from pathlib import Path, PurePosixPath
          import sys
          import tarfile

          bootstrap = Path("trusted/.github/scripts/final_audit_regenerate_additions.py")
          spec = importlib.util.spec_from_file_location("final_audit_regenerate_additions", bootstrap)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load trusted additions regeneration bootstrap")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def decode_transport(data: bytes, label: str) -> bytes:
              """Decode the exact pinned legacy blob while tolerating transport framing."""
              canonical = b"".join(data.split())
              module.require(bool(canonical), f"{label} transport is empty")
              try:
                  decoded = base64.b64decode(canonical, validate=False)
              except (binascii.Error, ValueError) as exc:
                  raise RuntimeError(f"{label} transport is invalid: {exc}") from exc
              module.require(bool(decoded), f"{label} decoded to an empty payload")
              return decoded

          def recovered_tar_prefix(archive_bytes: bytes) -> tuple[bytes, int | None]:
              """Return bytes emitted before XZ corruption without guessing damaged input."""
              decompressor = lzma.LZMADecompressor(format=lzma.FORMAT_XZ)
              output = bytearray()
              corrupt_at: int | None = None
              chunk_size = 64
              for offset in range(0, len(archive_bytes), chunk_size):
                  block = archive_bytes[offset : offset + chunk_size]
                  try:
                      output.extend(decompressor.decompress(block))
                  except lzma.LZMAError:
                      corrupt_at = offset
                      break
                  if decompressor.eof:
                      break
              module.require(bool(output), "predecessor XZ stream produced no tar bytes")
              return bytes(output), corrupt_at

          def safe_extract(archive_bytes: bytes, destination: Path) -> None:
              """Extract only when the complete tar terminator precedes XZ corruption."""
              tar_bytes, corrupt_at = recovered_tar_prefix(archive_bytes)
              offset = 0
              total = 0
              members: list[tarfile.TarInfo] = []
              terminator_end: int | None = None
              zero_block = b"\0" * 512

              while offset + 512 <= len(tar_bytes):
                  header = tar_bytes[offset : offset + 512]
                  if header == zero_block:
                      module.require(
                          offset + 1024 <= len(tar_bytes)
                          and tar_bytes[offset + 512 : offset + 1024] == zero_block,
                          "recovered tar has only one end-of-archive zero block",
                      )
                      module.require(
                          not any(tar_bytes[offset:]),
                          "recovered bytes after tar terminator are not zero padding",
                      )
                      terminator_end = offset + 1024
                      break

                  try:
                      member = tarfile.TarInfo.frombuf(header, "utf-8", "surrogateescape")
                  except tarfile.HeaderError as exc:
                      raise RuntimeError(f"invalid recovered tar header at offset {offset}: {exc}") from exc

                  path = PurePosixPath(member.name)
                  module.require(
                      not path.is_absolute() and ".." not in path.parts,
                      f"unsafe recovered archive path: {member.name!r}",
                  )
                  module.require(
                      member.name in {"runtime", "payload"}
                      or member.name.startswith(("runtime/", "payload/")),
                      f"unexpected recovered archive member: {member.name!r}",
                  )
                  module.require(
                      member.isdir() or member.isreg(),
                      f"unsupported recovered archive member type: {member.name!r}",
                  )

                  data_start = offset + 512
                  data_end = data_start + member.size
                  padded_end = data_start + ((member.size + 511) // 512) * 512
                  module.require(
                      padded_end <= len(tar_bytes),
                      f"recovered tar ends inside member {member.name!r}",
                  )
                  total += member.size
                  module.require(
                      total <= module.MAX_ADDITIONS_SIZE,
                      f"recovered additions exceed size bound: {total}",
                  )
                  members.append(member)
                  offset = padded_end

              module.require(
                  terminator_end is not None,
                  "complete tar terminator was not recovered before XZ corruption",
              )
              complete_tar = tar_bytes[:terminator_end]
              with tarfile.open(fileobj=io.BytesIO(complete_tar), mode="r:") as archive:
                  parsed = archive.getmembers()
                  module.require(
                      [item.name for item in parsed] == [item.name for item in members],
                      "recovered tar member list changed during parser verification",
                  )
                  archive.extractall(destination, members=parsed, filter="data")

              required = {
                  "runtime/document_symbols.py",
                  "payload/tools/ci/check_repository_quality.py",
              }
              recovered = {item.name for item in members}
              missing = sorted(required - recovered)
              module.require(
                  not missing,
                  f"complete recovered tar is missing required members: {missing}",
              )
              print(
                  "Recovered complete predecessor tar before corrupt XZ tail: "
                  f"members={len(members)} payload_bytes={total} "
                  f"xz_corrupt_offset={corrupt_at} tar_bytes={len(complete_tar)}"
              )

          module.decode_transport = decode_transport
          module.safe_extract = safe_extract
          sys.argv = [
              str(bootstrap),
              "--repository", "work",
              "--trusted-root", "trusted",
              "--runner", "trusted/.github/scripts/final_audit_runner.py",
          ]
          raise SystemExit(module.main())
          PY

      - name: Re-verify trusted runner syntax after binding
        run: python -m py_compile trusted/.github/scripts/final_audit_runner.py

      - name: Reconstruct, validate, and publish regenerated audit tree
        id: audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python trusted/.github/scripts/final_audit_runner.py --repository work
