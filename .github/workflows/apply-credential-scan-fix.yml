name: Apply repository credential scan fix
# Trigger the staged remediation after the workflow exists on the branch.

on:
  push:
    branches:
      - agent/repository-wide-security-documentation-audit
    paths:
      - .github/workflows/apply-credential-scan-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-repository-credential-scan-fix
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/repository-wide-security-documentation-audit
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Apply credential scanning changes
        run: python3 .github/scripts/apply_credential_scan_fix.py

      - name: Remove temporary remediation files from validation tree
        run: |
          rm -f .github/workflows/apply-credential-scan-fix.yml
          rm -f .github/scripts/apply_credential_scan_fix.py

      - name: Validate remediation
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests==2.34.2
          python3 tools/ci/check_python_syntax.py
          python3 tools/ci/full_repository_audit.py --fail-on low
          python3 -m unittest discover -s tests -p 'test_ci_*.py' -v
          git diff --check

      - name: Commit validated remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ci/full_repository_audit.py tests/test_ci_full_repository_audit.py
          git diff --cached --check
          git commit -m "fix: scan tracked files for credential material"
          git push origin HEAD:agent/repository-wide-security-documentation-audit
