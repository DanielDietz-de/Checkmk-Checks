name: Clean Codex remediation tree

on:
  push:
    branches:
      - agent/repository-wide-security-documentation-audit
    paths:
      - .github/workflows/clean-codex-remediation.yml

permissions:
  contents: write

concurrency:
  group: clean-codex-remediation
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Restore clean intended baseline
        run: |
          set -euo pipefail
          git restore \
            --source=e797ad970f41206c936b854ab2f0fdf453f01386 \
            --staged \
            --worktree \
            .
          chmod 0755 cohesity/src/cohesity/libexec/agent_cohesity
          python3 tools/ci/generate_package_reference.py --write

      - name: Install pinned validation dependencies
        run: >-
          python3 -m pip install --disable-pip-version-check
          pytest==9.1.1
          requests==2.34.2
          ruff==0.15.22

      - name: Validate cleaned tree
        run: |
          set -euo pipefail
          python3 tools/ci/sync_repository_facts.py
          python3 tools/ci/sync_package_metadata.py
          python3 tools/ci/generate_package_reference.py
          python3 tools/ci/manage_module_docstrings.py
          python3 tools/ci/check_python_syntax.py
          python3 tools/ci/full_repository_audit.py
          python3 tools/ci/pin_supply_chain.py --check
          ruff check --select E9,F63,F7,F82 tools/ci tests semu cohesity
          pytest -q tests .github/tests */tests
          git diff --check
          test ! -e .github/workflows/clean-codex-remediation.yml

      - name: Commit cleaned remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: retain only validated Codex remediations"
          git push origin HEAD:agent/repository-wide-security-documentation-audit
