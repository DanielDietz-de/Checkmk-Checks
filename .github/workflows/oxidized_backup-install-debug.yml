name: oxidized_backup install diagnostic

on:
  pull_request:
    paths:
      - "oxidized_backup/**"
      - ".github/workflows/oxidized_backup-install-debug.yml"

permissions:
  contents: read

env:
  PACKAGE_DIR: oxidized_backup
  PACKAGE_NAME: oxidized_backup
  PACKAGE_VERSION: "1.1.0"

jobs:
  install-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          set -euo pipefail
          python "$PACKAGE_DIR/tools/build_mkp.py" \
            --version "$PACKAGE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --packaged-version 2.4.0p34 \
            --output-dir "$PACKAGE_DIR"

      - name: Start clean Checkmk
        run: |
          set -euo pipefail
          docker run --detach \
            --name checkmk-install-debug \
            --env CMK_PASSWORD='diagnostic-password' \
            --env CMK_SITE_ID='cmk' \
            --env PACKAGE_NAME \
            --env PACKAGE_VERSION \
            checkmk/check-mk-raw:2.4.0p34
          for _ in $(seq 1 120); do
            if docker logs checkmk-install-debug 2>&1 | grep -q '### CONTAINER STARTED'; then
              exit 0
            fi
            sleep 2
          done
          docker logs checkmk-install-debug
          exit 1

      - name: Copy package
        run: |
          docker cp \
            "$PACKAGE_DIR/${PACKAGE_NAME}-${PACKAGE_VERSION}.mkp" \
            "checkmk-install-debug:/tmp/${PACKAGE_NAME}-${PACKAGE_VERSION}.mkp"

      - name: Trace install
        run: |
          docker exec --user cmk checkmk-install-debug bash -lc '
            set -euxo pipefail
            export PAGER=cat
            package="/tmp/${PACKAGE_NAME}-${PACKAGE_VERSION}.mkp"
            mkp inspect "$package" >/tmp/mkp-inspect.txt
            mkp add "$package"
            mkp enable "$PACKAGE_NAME" "$PACKAGE_VERSION"
            find "$HOME/local" -maxdepth 10 -type f -o -type l | sort
            test -x "$HOME/local/share/check_mk/agents/plugins/$PACKAGE_NAME"
            test -r "$HOME/local/lib/python3/cmk_addons/plugins/$PACKAGE_NAME/bakery_common.py"
            test -r "$HOME/local/lib/python3/cmk_addons/plugins/$PACKAGE_NAME/rulesets/ruleset_${PACKAGE_NAME}_bakery.py"
            test -r "$HOME/local/lib/python3/cmk/base/cee/plugins/bakery/${PACKAGE_NAME}.py"
          '

      - name: Remove container
        if: always()
        run: docker rm --force checkmk-install-debug || true
