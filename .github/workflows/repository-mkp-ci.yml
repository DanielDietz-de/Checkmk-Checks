name: Repository MKP validation

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-mkp-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  DIST_DIR: dist/repository-mkps
  PACKAGED_VERSION: 2.5.0p9

jobs:
  select:
    name: Select validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.selection.outputs.mode }}
      packages: ${{ steps.selection.outputs.packages }}
      package-count: ${{ steps.selection.outputs.package-count }}
      reason: ${{ steps.selection.outputs.reason }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Detect affected packages
        id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$CURRENT_SHA"
          fi
          python .github/scripts/detect_affected_packages.py \
            --repository . \
            --base "$base" \
            --head "$head" \
            --event-name "$EVENT_NAME" \
            --ref "$EVENT_REF" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish scope summary
        env:
          MODE: ${{ steps.selection.outputs.mode }}
          PACKAGES: ${{ steps.selection.outputs.packages }}
          REASON: ${{ steps.selection.outputs.reason }}
        run: |
          {
            echo "## MKP validation scope"
            echo
            echo "- Mode: \`$MODE\`"
            echo "- Packages: \`$PACKAGES\`"
            echo "- Reason: $REASON"
          } >>"$GITHUB_STEP_SUMMARY"

  tests:
    name: Run all package tests
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Record documentation-only scope
        if: needs.select.outputs.mode == 'none'
        run: echo "Documentation-only change; package tests are not required."

      - name: Check out repository
        if: needs.select.outputs.mode != 'none'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        if: needs.select.outputs.mode != 'none'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned test tools
        if: needs.select.outputs.mode != 'none'
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1
          requests==2.34.2
          ruff==0.15.22

      - name: Validate repository packaging scripts
        if: needs.select.outputs.mode != 'none'
        run: |
          set -euo pipefail
          ruff check --select E9,F63,F7,F82 .github/scripts .github/tests create_mkp_index.py
          python -m compileall -q .github/scripts .github/tests create_mkp_index.py

      - name: Test repository release and selector tooling
        if: needs.select.outputs.mode != 'none'
        run: pytest -q .github/tests

      - name: Verify package test collection
        if: needs.select.outputs.mode != 'none'
        env:
          MODE: ${{ needs.select.outputs.mode }}
          PACKAGES_JSON: ${{ needs.select.outputs.packages }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "full" ]]; then
            pytest -q */tests
          else
            mapfile -t test_dirs < <(
              python - <<'PY'
          import json
          import os
          from pathlib import Path

          packages = json.loads(os.environ["PACKAGES_JSON"])
          test_dirs = [Path(package) / "tests" for package in packages]
          missing = [str(path.parent) for path in test_dirs if not path.is_dir()]
          if missing:
              raise SystemExit(f"Selected packages have no test directory: {', '.join(missing)}")
          for path in test_dirs:
              print(path)
          PY
            )
            ((${#test_dirs[@]})) || { echo "No targeted package tests selected" >&2; exit 1; }
            pytest -q "${test_dirs[@]}"
          fi

      - name: Execute each selected package test suite independently
        if: needs.select.outputs.mode != 'none'
        env:
          MODE: ${{ needs.select.outputs.mode }}
          PACKAGES_JSON: ${{ needs.select.outputs.packages }}
        run: |
          set -uo pipefail
          : > package-tests.log
          failures=()
          if [[ "$MODE" == "full" ]]; then
            shopt -s nullglob
            test_dirs=(*/tests)
          else
            mapfile -t test_dirs < <(
              python - <<'PY'
          import json
          import os

          for package in json.loads(os.environ["PACKAGES_JSON"]):
              print(f"{package}/tests")
          PY
            )
          fi
          for test_dir in "${test_dirs[@]}"; do
            echo "===== pytest ${test_dir} =====" | tee -a package-tests.log
            if pytest -q "$test_dir" 2>&1 | tee -a package-tests.log; then
              echo "PASS ${test_dir}" | tee -a package-tests.log
            else
              echo "FAIL ${test_dir}" | tee -a package-tests.log
              failures+=("$test_dir")
            fi
          done
          if ((${#failures[@]})); then
            printf 'Failed package test suites:\n' | tee -a package-tests.log
            printf ' - %s\n' "${failures[@]}" | tee -a package-tests.log
            exit 1
          fi

      - name: Upload package test log
        if: always() && needs.select.outputs.mode != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-package-tests
          path: package-tests.log
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build all active MKPs
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
      package-count: ${{ steps.metadata.outputs.package-count }}

    steps:
      - name: Record documentation-only scope
        if: needs.select.outputs.mode == 'none'
        run: echo "Documentation-only change; MKP build is not required."

      - name: Check out repository
        if: needs.select.outputs.mode != 'none'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        if: needs.select.outputs.mode != 'none'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Prepare repository-wide release manifests
        if: needs.select.outputs.mode != 'none'
        run: >-
          python .github/scripts/prepare_repository_mkp_release.py
          --repository .

      - name: Build deterministic MKPs
        if: needs.select.outputs.mode != 'none'
        env:
          MODE: ${{ needs.select.outputs.mode }}
          PACKAGES_JSON: ${{ needs.select.outputs.packages }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$MODE" == "targeted" ]]; then
            mapfile -t packages < <(
              python - <<'PY'
          import json
          import os

          for package in json.loads(os.environ["PACKAGES_JSON"]):
              print(package)
          PY
            )
            for package in "${packages[@]}"; do
              args+=(--package "$package")
            done
          fi
          python .github/scripts/build_repository_mkps.py \
            --repository . \
            --output "$DIST_DIR" \
            --packaged-version "$PACKAGED_VERSION" \
            "${args[@]}"

      - name: Verify checksums and package index
        id: metadata
        if: needs.select.outputs.mode != 'none'
        env:
          MODE: ${{ needs.select.outputs.mode }}
          EXPECTED_TARGETED_COUNT: ${{ needs.select.outputs.package-count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path(os.environ["DIST_DIR"])
          packages = json.loads((dist / "packages.json").read_text(encoding="utf-8"))
          if not packages:
              raise SystemExit("No packages were built")
          if os.environ["MODE"] == "targeted" and len(packages) != int(os.environ["EXPECTED_TARGETED_COUNT"]):
              raise SystemExit("Targeted package count does not match selector output")
          names = set()
          directories = set()
          for package in packages:
              if package["name"] in names:
                  raise SystemExit(f"Duplicate package name: {package['name']}")
              if package["package_dir"] in directories:
                  raise SystemExit(f"Duplicate package directory: {package['package_dir']}")
              names.add(package["name"])
              directories.add(package["package_dir"])
              package_path = dist / package["path"]
              checksum_path = package_path.with_name(package_path.name + ".sha256")
              expected = checksum_path.read_text(encoding="utf-8").split()[0]
              actual = hashlib.sha256(package_path.read_bytes()).hexdigest()
              if expected != actual:
                  raise SystemExit(f"Checksum mismatch: {package_path}")
          artifact = f"repository-mkps-{os.environ['GITHUB_RUN_NUMBER']}"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"artifact-name={artifact}\n")
              handle.write(f"package-count={len(packages)}\n")
          print(f"Verified {len(packages)} package archives")
          PY

      - name: Upload repository MKPs
        if: needs.select.outputs.mode != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: ${{ env.DIST_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  validate:
    name: Validate all MKPs on Checkmk ${{ matrix.label }}
    needs:
      - select
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 2.4.0p34
            image: checkmk/check-mk-raw:2.4.0p34@sha256:d6cb29c34ce8199cdae5246d1aadad489ef43250e211ad9b25d375237ee2eb34
          - label: 2.5.0p9
            image: checkmk/check-mk-community:2.5.0p9@sha256:60e495047a30a27d030b1753f3b18c10c031832d3385d0b417bddcda51beeb66

    steps:
      - name: Record documentation-only scope
        if: needs.select.outputs.mode == 'none'
        run: echo "Documentation-only change; Checkmk runtime validation is not required."

      - name: Check out repository
        if: needs.select.outputs.mode != 'none'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download selected MKPs
        if: needs.select.outputs.mode != 'none'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.DIST_DIR }}

      - name: Start Checkmk validation container
        if: needs.select.outputs.mode != 'none'
        env:
          CHECKMK_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --detach \
            --name checkmk-repository-ci \
            --env CMK_PASSWORD='repository-mkp-ci-password' \
            --env CMK_SITE_ID='cmk' \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            "$CHECKMK_IMAGE"

          for _ in $(seq 1 120); do
            if docker logs checkmk-repository-ci 2>&1 | grep -q '### CONTAINER STARTED'; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' checkmk-repository-ci | grep -q true; then
              docker logs checkmk-repository-ci
              exit 1
            fi
            sleep 2
          done
          docker logs checkmk-repository-ci
          echo 'Checkmk container did not become ready' >&2
          exit 1

      - name: Install and validate selected package set
        if: needs.select.outputs.mode != 'none'
        env:
          CHECKMK_VERSION: ${{ matrix.label }}
        run: |
          docker exec --user cmk checkmk-repository-ci bash -lc \
            "python3 /work/.github/scripts/validate_repository_mkps.py \
              --dist /work/${DIST_DIR} \
              --checkmk-version ${CHECKMK_VERSION}"

      - name: Show Checkmk logs on failure
        if: failure() && needs.select.outputs.mode != 'none'
        run: docker logs checkmk-repository-ci || true

      - name: Remove validation container
        if: always() && needs.select.outputs.mode != 'none'
        run: docker rm --force checkmk-repository-ci || true

  publication-dry-run:
    name: Verify release publication transaction
    needs:
      - select
      - tests
      - build
      - validate
    if: >-
      needs.select.outputs.mode == 'full' &&
      github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download validated repository MKPs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: ${{ env.DIST_DIR }}

      - name: Stage complete release exactly as publication will
        run: |
          set -euo pipefail
          python .github/scripts/prepare_repository_mkp_release.py --repository . --complete
          python .github/scripts/stage_repository_release.py --repository . --dist "$DIST_DIR"
          python tools/ci/sync_package_metadata.py --write
          python update_readmes.py
          python tools/ci/generate_package_reference.py --write
          python create_mkp_index.py

      - name: Rebuild staged state deterministically
        run: >-
          python .github/scripts/build_repository_mkps.py
          --repository .
          --output dist/rebuilt-repository-mkps
          --packaged-version "$PACKAGED_VERSION"

      - name: Verify final release state and bounded diff
        run: >-
          python .github/scripts/verify_repository_release.py
          --repository .
          --source-dist "$DIST_DIR"
          --rebuilt-dist dist/rebuilt-repository-mkps

      - name: Upload publication dry-run diff
        if: always()
        run: git diff --binary HEAD > repository-publication-dry-run.patch

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repository-publication-dry-run
          path: repository-publication-dry-run.patch
          if-no-files-found: error
          retention-days: 14
