name: PR 22 repair trigger

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/repository-mkp-ci.yml

permissions:
  contents: write

concurrency:
  group: pr22-repair-trigger
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'agent/fix-generated-mkp-checkmk-25'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/fix-generated-mkp-checkmk-25
          fetch-depth: 0

      - name: Restore current master and final workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin master
          cp oxidized_backup/src/info /tmp/oxidized_backup-info
          git checkout origin/master -- oxidized_backup
          install -D -m 0644 /tmp/oxidized_backup-info oxidized_backup/src/info
          git rm -f .github/workflows/oxidized_backup-ci.yml 2>/dev/null || true
          mv .github/repository-mkp-ci.final.yml \
            .github/workflows/repository-mkp-ci.yml

      - name: Extract and apply repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/pr22-repair.yml').read_text(encoding='utf-8').splitlines()
          body = []
          collecting = False
          for line in source:
              if line.strip() == "python - <<'PY'":
                  collecting = True
                  continue
              if collecting and line.strip() == 'PY':
                  break
              if collecting:
                  body.append(line[10:] if line.startswith('          ') else line)
          if not body:
              raise SystemExit('Embedded repair program was not found')
          program = '\n'.join(body) + '\n'
          substitutions = {
              'if marker not in build:\n    raise RuntimeError("Unable to locate manifest validation block")\nbuild = build.replace(marker, validation, 1)':
                  'if marker in build:\n    build = build.replace(marker, validation, 1)',
              'if old_symlink not in build:\n    raise RuntimeError("Unable to locate symlink validation block")\nbuild = build.replace(old_symlink, new_symlink, 1)':
                  'if old_symlink in build:\n    build = build.replace(old_symlink, new_symlink, 1)',
              'if old_members not in build:\n    raise RuntimeError("Unable to locate archive inventory block")\nbuild = build.replace(old_members, new_members, 1)':
                  'if old_members in build:\n    build = build.replace(old_members, new_members, 1)',
          }
          for old, new in substitutions.items():
              program = program.replace(old, new)
          Path('/tmp/pr22_repair.py').write_text(program, encoding='utf-8')
          EXTRACT
          python /tmp/pr22_repair.py

          python - <<'HARDEN'
          from pathlib import Path

          path = Path('.github/scripts/build_repository_mkps.py')
          text = path.read_text(encoding='utf-8')
          if 'import re\n' not in text:
              text = text.replace('import pprint\n', 'import pprint\nimport re\n', 1)
          if '_SAFE_PACKAGE_TOKEN = re.compile' not in text:
              text = text.replace(
                  'USABLE_UNTIL = "2.5.99"\n',
                  'USABLE_UNTIL = "2.5.99"\n_SAFE_PACKAGE_TOKEN = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_.-]*$")\n',
                  1,
              )

          function_start = text.index('def read_manifest(')
          function_end = text.index('\ndef _safe_relative_path', function_start)
          manifest_function = text[function_start:function_end]
          if 'unsafe {field} value' not in manifest_function:
              anchor = '    manifest = dict(manifest)\n'
              validation = '\n'.join([
                  '    for field in ("name", "version", "version.min_required"):',
                  '        value = manifest[field]',
                  '        if not isinstance(value, str) or not _SAFE_PACKAGE_TOKEN.fullmatch(value):',
                  '            raise ValueError(f"{info_path}: unsafe {field} value {value!r}")',
                  '',
              ])
              position = text.index(anchor, function_start)
              text = text[:position] + validation + text[position:]

          source_start = text.index('        if source.is_symlink():', text.index('def _source_path'))
          source_end = text.index('        return source', source_start)
          symlink_block = '\n'.join([
              '        if source.is_symlink():',
              '            parent = source.parent.resolve()',
              '            if not parent.is_relative_to(resolved_root):',
              '                raise ValueError(f"{source}: symlink parent escapes package source root")',
              '            target = Path(os.readlink(source))',
              '            if target.is_absolute():',
              '                raise ValueError(f"{source}: absolute symlink target is not allowed")',
              '            resolved_target = (source.parent / target).resolve(strict=False)',
              '            if not resolved_target.is_relative_to(resolved_root):',
              '                raise ValueError(f"{source}: symlink target escapes package source root")',
              '        elif not source.resolve().is_relative_to(resolved_root):',
              '            raise ValueError(f"{source}: source path escapes package source root")',
              '',
          ])
          text = text[:source_start] + symlink_block + text[source_end:]
          text = text.replace(
              '    info.mode = stat.S_IMODE(st.st_mode)\n',
              '    info.mode = stat.S_IMODE(st.st_mode) & 0o777\n',
              1,
          )

          verify_start = text.index('    with tarfile.open(package_path, mode="r:gz") as outer:')
          metadata_start = text.index('        info_file = outer.extractfile', verify_start)
          inventory = '\n'.join([
              '    with tarfile.open(package_path, mode="r:gz") as outer:',
              '        outer_members = outer.getmembers()',
              '        outer_names = [member.name for member in outer_members]',
              '        if len(outer_names) != len(set(outer_names)):',
              '            raise ValueError(f"{package_path}: duplicate outer archive members")',
              '        if any(PurePosixPath(name).name != name for name in outer_names):',
              '            raise ValueError(f"{package_path}: nested outer archive member")',
              '        members = {member.name: member for member in outer_members}',
              '        required = {"info", "info.json"} | {f"{part}.tar" for part in expected["files"]}',
              '        unexpected = sorted(set(members) ^ required)',
              '        if unexpected:',
              '            raise ValueError(',
              '                f"{package_path}: unexpected outer member inventory {unexpected}"',
              '            )',
              '',
          ])
          text = text[:verify_start] + inventory + text[metadata_start:]
          path.write_text(text, encoding='utf-8')
          HARDEN

      - name: Validate repaired tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 requests==2.34.2 ruff==0.15.22
          ruff check --select E9,F63,F7,F82 .github/scripts .github/tests create_mkp_index.py
          python -m compileall -q .github/scripts .github/tests create_mkp_index.py
          pytest -q .github/tests
          failures=()
          shopt -s nullglob
          for test_dir in */tests; do
            if ! pytest -q "$test_dir"; then
              failures+=("$test_dir")
            fi
          done
          if ((${#failures[@]})); then
            printf 'Failed package test suites:\n' >&2
            printf ' - %s\n' "${failures[@]}" >&2
            exit 1
          fi
          validation_root=$(mktemp -d)
          cp -a . "$validation_root/repository"
          rm -rf "$validation_root/repository/.git"
          cd "$validation_root/repository"
          python .github/scripts/prepare_repository_mkp_release.py --repository .
          python .github/scripts/build_repository_mkps.py \
            --repository . \
            --output "$validation_root/dist" \
            --packaged-version 2.5.0p9 \
            --usable-until 2.5.99

      - name: Publish repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/pr22-repair.yml \
            .github/repository-mkp-ci.final.yml 2>/dev/null || true
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): resolve repository MKP validation and security issues"
          git push origin HEAD:agent/fix-generated-mkp-checkmk-25
