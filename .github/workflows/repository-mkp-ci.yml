name: PR 22 final workflow generator

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/repository-mkp-ci.yml

permissions:
  contents: write

concurrency:
  group: pr22-final-workflow-generator
  cancel-in-progress: false

jobs:
  generate:
    if: github.head_ref == 'agent/fix-generated-mkp-checkmk-25'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/fix-generated-mkp-checkmk-25
          fetch-depth: 0

      - name: Generate hardened workflow as inert source file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 2aef50b4203ba90ae8e3034019dc065d9ec1daf8:.github/repository-mkp-ci.final.yml \
            > .github/repository-mkp-ci.generated.yml

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/repository-mkp-ci.generated.yml')
          source = path.read_text(encoding='utf-8')
          replacements = {
              'actions/checkout@v6': 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6',
              'actions/setup-python@v6': 'actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6',
              'actions/upload-artifact@v7': 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7',
              'actions/download-artifact@v7': 'actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7',
              'pytest==8.4.1': 'pytest==9.1.1',
              'requests==2.32.4': 'requests==2.34.2',
              'ruff==0.12.4': 'ruff==0.15.22',
              'checkmk/check-mk-raw:2.4.0p34': 'checkmk/check-mk-raw:2.4.0p34@sha256:d6cb29c34ce8199cdae5246d1aadad489ef43250e211ad9b25d375237ee2eb34',
              'checkmk/check-mk-community:2.5.0p9': 'checkmk/check-mk-community:2.5.0p9@sha256:60e495047a30a27d030b1753f3b18c10c031832d3385d0b417bddcda51beeb66',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Missing expected workflow token: {old}')
              source = source.replace(old, new)

          source = source.replace(
              '      - ".github/scripts/**"\n',
              '      - ".github/scripts/**"\n      - ".github/tests/**"\n',
          )
          source = source.replace(
              '          ruff check --select E9,F63,F7,F82 .github/scripts create_mkp_index.py\n'
              '          python -m compileall -q .github/scripts create_mkp_index.py\n',
              '          ruff check --select E9,F63,F7,F82 .github/scripts .github/tests create_mkp_index.py\n'
              '          python -m compileall -q .github/scripts .github/tests create_mkp_index.py\n',
          )
          marker = '      - name: Execute every package test suite\n'
          repository_tests = (
              '      - name: Test repository release tooling\n'
              '        run: pytest -q .github/tests\n\n'
          )
          if repository_tests not in source:
              source = source.replace(marker, repository_tests + marker, 1)

          path.write_text(source, encoding='utf-8')
          PY

          git add .github/repository-mkp-ci.generated.yml
          git diff --cached --check
          git commit -m "chore: stage final repository MKP workflow"
          git push origin HEAD:agent/fix-generated-mkp-checkmk-25
