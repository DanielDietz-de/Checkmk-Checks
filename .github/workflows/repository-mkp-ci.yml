name: PR 22 repair trigger

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/repository-mkp-ci.yml

permissions:
  contents: write

concurrency:
  group: pr22-repair-trigger
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'agent/fix-generated-mkp-checkmk-25'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/fix-generated-mkp-checkmk-25
          fetch-depth: 0

      - name: Restore current master and final workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin master

          # The synthetic merge commit resolves history only. Restore the full
          # current-master Oxidized implementation, while retaining this PR's
          # canonical repository manifest for regeneration below.
          cp oxidized_backup/src/info /tmp/oxidized_backup-info
          git checkout origin/master -- oxidized_backup
          install -D -m 0644 /tmp/oxidized_backup-info oxidized_backup/src/info
          git rm -f .github/workflows/oxidized_backup-ci.yml 2>/dev/null || true

          mv .github/repository-mkp-ci.final.yml \
            .github/workflows/repository-mkp-ci.yml

      - name: Extract and apply repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/pr22-repair.yml').read_text(encoding='utf-8').splitlines()
          body = []
          collecting = False
          for line in source:
              if line.strip() == "python - <<'PY'":
                  collecting = True
                  continue
              if collecting and line.strip() == 'PY':
                  break
              if collecting:
                  body.append(line[10:] if line.startswith('          ') else line)
          if not body:
              raise SystemExit('Embedded repair program was not found')
          Path('/tmp/pr22_repair.py').write_text('\n'.join(body) + '\n', encoding='utf-8')
          EXTRACT
          python /tmp/pr22_repair.py

          python - <<'DOCS'
          from pathlib import Path

          path = Path('oxidized_backup/PACKAGING.md')
          text = path.read_text(encoding='utf-8')
          start = text.find('## Build and persistence workflow')
          end = text.find('## Versioning rule', start)
          if start != -1 and end != -1:
              replacement = '''## Repository-wide build and persistence workflow

The repository-wide MKP workflow runs the package tests, builds the deterministic archive, installs the complete supported package set into clean Checkmk 2.4 and 2.5 sites, and validates plug-in registration, manuals, and core reloads. Pull-request runs are read-only.

After a successful non-bot push to `master`, the same workflow persists the exact validated MKP and checksum set, regenerates repository metadata, and refuses publication when package inputs changed after the build started.

'''
              text = text[:start] + replacement + text[end:]
          text = text.replace(
              'requires a new `PACKAGE_VERSION` in `.github/workflows/oxidized_backup-ci.yml`.',
              'requires a version update in the canonical `oxidized_backup/src/info` manifest.',
          )
          path.write_text(text, encoding='utf-8')
          DOCS

      - name: Validate repaired tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            pytest==9.1.1 requests==2.34.2 ruff==0.15.22
          ruff check --select E9,F63,F7,F82 .github/scripts .github/tests create_mkp_index.py
          python -m compileall -q .github/scripts .github/tests create_mkp_index.py
          pytest -q .github/tests
          failures=()
          shopt -s nullglob
          for test_dir in */tests; do
            if ! pytest -q "$test_dir"; then
              failures+=("$test_dir")
            fi
          done
          if ((${#failures[@]})); then
            printf 'Failed package test suites:\n' >&2
            printf ' - %s\n' "${failures[@]}" >&2
            exit 1
          fi
          validation_root=$(mktemp -d)
          cp -a . "$validation_root/repository"
          rm -rf "$validation_root/repository/.git"
          cd "$validation_root/repository"
          python .github/scripts/prepare_repository_mkp_release.py --repository .
          python .github/scripts/build_repository_mkps.py \
            --repository . \
            --output "$validation_root/dist" \
            --packaged-version 2.5.0p9 \
            --usable-until 2.5.99

      - name: Publish repaired branch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/pr22-repair.yml \
            .github/repository-mkp-ci.final.yml 2>/dev/null || true
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): resolve repository MKP validation and security issues"
          git push origin HEAD:agent/fix-generated-mkp-checkmk-25
