name: PR 38 shell scanner remediation

on:
  push:
    branches:
      - agent/final-repository-completion-audit

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Apply validated shell scanner fixes
        env:
          SCAN_BLOCK_B64: 
          TEST_FILE_B64: 
        run: |
          set -euo pipefail
          test "$(git hash-object tools/ci/check_function_documentation.py)" = "7045432a49a33f769df6b6699d59d6b5c2d45718"
          python3 - <<'PYCODE'
          import base64
          import os
          from pathlib import Path

          target = Path("tools/ci/check_function_documentation.py")
          text = target.read_text(encoding="utf-8")
          start = text.index("def _scan_shell(")
          end = text.index("def shell_function_declarations(", start)
          replacement = base64.b64decode(os.environ["SCAN_BLOCK_B64"]).decode("utf-8")
          target.write_text(text[:start] + replacement + text[end:], encoding="utf-8", newline="")

          test_path = Path(".github/tests/test_function_documentation_shell_edge_cases.py")
          test_path.write_bytes(base64.b64decode(os.environ["TEST_FILE_B64"]))
          PYCODE
          test "$(git hash-object tools/ci/check_function_documentation.py)" = "693a9158d552f741c0bfedc2861d96bcc228446d"
          test "$(git hash-object .github/tests/test_function_documentation_shell_edge_cases.py)" = "8d2f75568d270ad451aebba70acf2185758d426a"

      - name: Validate final source tree
        run: |
          set -euo pipefail
          python3 -m py_compile tools/ci/check_function_documentation.py
          bash -n <(printf '%s\n' 'undocumented_helper\' '() { :; }')
          bash -n <(printf '%s\n' 'value=$[1 << 2]' 'undocumented_helper() { :; }')
          python3 - <<'PYCODE'
          import importlib.util
          from pathlib import Path

          path = Path("tools/ci/check_function_documentation.py")
          spec = importlib.util.spec_from_file_location("check_function_documentation", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          continued = "#!/bin/bash\nundocumented_helper\\\n() { :; }\n"
          legacy = "#!/bin/bash\nvalue=$[1 << 2]\nundocumented_helper() { :; }\n"
          assert [d.name for d in module.shell_function_declarations(continued)] == ["undocumented_helper"]
          assert [d.name for d in module.shell_function_declarations(legacy)] == ["undocumented_helper"]
          PYCODE
          git add tools/ci/check_function_documentation.py .github/tests/test_function_documentation_shell_edge_cases.py
          git rm .github/workflows/pr38-shell-scanner-remediation.yml
          python3 tools/ci/check_function_documentation.py
          git diff --cached --check

      - name: Commit final remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: cover shell scanner edge cases"
          git push origin HEAD:agent/final-repository-completion-audit
