name: Apply audited repository completion

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".repo-completion/**"
      - ".github/workflows/apply-repository-completion.yml"

permissions:
  contents: write

concurrency:
  group: apply-repository-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/repository-wide-security-documentation-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out audited branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify staging lineage
        env:
          EXPECTED_PARENT: 5a54a6b9d3c89d401fbabc89a81e4dd4a96e7049
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Reconstruct and apply audited patch
        env:
          PATCH_SHA256: 41b671a8dd497db3150d8818fd5af5b359de79500b28fe400ce3199199f2ff0f
          EXPECTED_TREE: e6be190858f6fd5ff239dadb35a2fb067254d187
        run: |
          set -euo pipefail
          cat .repo-completion/prefix .repo-completion/chunk-* > /tmp/repository-completion.patch.xz.b64
          base64 --decode /tmp/repository-completion.patch.xz.b64 > /tmp/repository-completion.patch.xz
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/repository-completion.patch.xz | sha256sum --check --strict
          xz --decompress --stdout /tmp/repository-completion.patch.xz > /tmp/repository-completion.patch
          git apply --check --binary /tmp/repository-completion.patch
          git apply --binary /tmp/repository-completion.patch
          rm -rf .repo-completion .github/workflows/apply-repository-completion.yml
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install validation tools
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1
          requests==2.34.2
          ruff==0.15.22

      - name: Validate exact final source tree
        run: |
          set -euo pipefail
          python3 tools/ci/pin_supply_chain.py --check
          python3 tools/ci/sync_package_metadata.py
          python3 tools/ci/generate_package_reference.py
          python3 tools/ci/manage_module_docstrings.py
          python3 tools/ci/check_python_syntax.py
          python3 tools/ci/full_repository_audit.py --fail-on low --output /tmp/repository-audit.json
          ruff check --select E9,F63,F7,F82 .github/scripts .github/tests create_mkp_index.py
          python3 -m pytest -q tests .github/tests */tests

      - name: Commit and publish exact validated tree
        env:
          EXPECTED_TREE: e6be190858f6fd5ff239dadb35a2fb067254d187
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf .pytest_cache
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "repository: complete code-driven security and documentation audit"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
