name: Final repository audit orchestrator

on:
  workflow_run:
    workflows:
      - Repository security and supply-chain guard
    types:
      - completed

permissions:
  actions: write
  contents: write

concurrency:
  group: final-repository-audit-orchestrator
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact staged audit payload
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/final-repository-completion-audit
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify trusted source state and reconstruct audited payloads
        env:
          EXPECTED_PREVIOUS_MASTER: 8fcc44efdf9a558d24112898b0e9dd18c31d05c2
          EXPECTED_AUDIT_BASE: ff1129c75c59f79ebec3d1fb61506a5d76c9ca4b
          EXPECTED_STAGING_SHA: b78fc6944b96915c0dac001a92128521d47b8b2e
          EXPECTED_BASE64_SHA256: 989206ae474beb1ef1756095a617e031d2df99394c26dfd1775c40a5c217b0e6
          EXPECTED_GZIP_SHA256: a474d18b5cf6084fe4dbb8b1bfe90472ca6cba2dc0a9d717734c3629b37717cc
          EXPECTED_PATCH_SHA256: 0a02b2c64eaed2c00dac46db6b72c5156216afbd50b4224bee8ee7648c04f9f0
          EXPECTED_PATCH_FILES: "204"
          EXPECTED_ADDITIONS_BASE64_SHA256: 91057688d247d20bf75c59743761f55724b481734727036b52bccc9b044ddbc3
          EXPECTED_ADDITIONS_XZ_SHA256: 11a52c585a7579d44dd24d89a33cbcb61c9bf4d0f41e6c72a269d99afde7023f
        run: |
          set -euo pipefail
          audit_sha=$(git rev-parse HEAD)
          test "$audit_sha" = "$EXPECTED_STAGING_SHA" || {
            echo "staging branch moved from the reviewed payload commit" >&2
            exit 1
          }
          printf 'AUDIT_SHA=%s\n' "$audit_sha" >> "$GITHUB_ENV"

          git fetch --no-tags origin master
          master_sha=$(git rev-parse origin/master)
          first_parent=$(git rev-parse 'origin/master^1')
          test "$first_parent" = "$EXPECTED_PREVIOUS_MASTER" || {
            echo "master is not the expected one-commit audit trigger merge" >&2
            exit 1
          }
          mapfile -t master_paths < <(git diff --name-only "$EXPECTED_PREVIOUS_MASTER" "$master_sha" | sort)
          expected_master_paths=(
            .github/final-audit-trigger
            .github/workflows/final-audit-orchestrator.yml
          )
          test "${master_paths[*]}" = "${expected_master_paths[*]}" || {
            printf 'Unexpected master changes since the reviewed orchestrator:\n%s\n' "${master_paths[*]}" >&2
            exit 1
          }

          python3 - <<'PY'
          from pathlib import PurePosixPath
          import subprocess

          base = 'ff1129c75c59f79ebec3d1fb61506a5d76c9ca4b'
          paths = subprocess.check_output(
              ['git', 'diff', '--name-only', base, 'HEAD'], text=True
          ).splitlines()
          allowed_roots = (
              '.github/final-audit-patch/',
              '.github/final-audit-payload/',
              '.github/final-audit-additions/',
          )
          allowed_file = '.github/workflows/apply-final-repository-audit.yml'
          unexpected = [
              path for path in paths
              if not path.startswith(allowed_roots) and path != allowed_file
          ]
          if unexpected:
              raise SystemExit(
                  'staging branch contains non-payload changes: ' + ', '.join(unexpected)
              )
          for raw in paths:
              path = PurePosixPath(raw)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'unsafe staging path: {raw!r}')
          PY

          mapfile -t chunks < <(find .github/final-audit-patch -maxdepth 1 -type f -name 'chunk*.b64' -print | sort)
          test "${#chunks[@]}" -eq 9 || {
            printf 'Expected 9 patch chunks, found %s\n' "${#chunks[@]}" >&2
            exit 1
          }
          cat "${chunks[@]}" > /tmp/final-audit.b64
          printf '%s  %s\n' "$EXPECTED_BASE64_SHA256" /tmp/final-audit.b64 | sha256sum --check --strict
          base64 --decode /tmp/final-audit.b64 > /tmp/final-audit.patch.gz
          printf '%s  %s\n' "$EXPECTED_GZIP_SHA256" /tmp/final-audit.patch.gz | sha256sum --check --strict
          gzip --decompress --stdout /tmp/final-audit.patch.gz > /tmp/final-audit.patch
          printf '%s  %s\n' "$EXPECTED_PATCH_SHA256" /tmp/final-audit.patch | sha256sum --check --strict

          python3 - <<'PY'
          from pathlib import PurePosixPath
          import os

          lines = open('/tmp/final-audit.patch', encoding='utf-8').read().splitlines()
          paths = []
          for line in lines:
              if not line.startswith('+++ source/'):
                  continue
              raw = line.split('\t', 1)[0][len('+++ source/'):]
              path = PurePosixPath(raw)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit(f'unsafe patch path: {raw!r}')
              if raw.startswith('.github/final-audit-') or raw.startswith('.github/workflows/final-audit-'):
                  raise SystemExit(f'patch contains staging/orchestrator path: {raw!r}')
              paths.append(raw)
          expected = int(os.environ['EXPECTED_PATCH_FILES'])
          if len(paths) != expected or len(set(paths)) != expected:
              raise SystemExit(
                  f'expected {expected} unique patch paths, got {len(paths)} entries / {len(set(paths))} unique'
              )
          PY

          additions=.github/final-audit-additions/additions.b64
          printf '%s  %s\n' "$EXPECTED_ADDITIONS_BASE64_SHA256" "$additions" | sha256sum --check --strict
          base64 --decode "$additions" > /tmp/audit-additions.tar.xz
          printf '%s  %s\n' "$EXPECTED_ADDITIONS_XZ_SHA256" /tmp/audit-additions.tar.xz | sha256sum --check --strict
          python3 - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          allowed_prefixes = ('runtime/', 'payload/')
          total = 0
          with tarfile.open('/tmp/audit-additions.tar.xz', mode='r:xz') as archive:
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe additions path: {member.name!r}')
                  if member.name not in {'runtime', 'payload'} and not member.name.startswith(allowed_prefixes):
                      raise SystemExit(f'unexpected additions path: {member.name!r}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'unsupported additions member type: {member.name!r}')
                  total += member.size
              if total > 250_000:
                  raise SystemExit(f'additions payload exceeds size bound: {total}')
              archive.extractall('/tmp/audit-additions', filter='data')
          PY

      - name: Reconstruct exact audited source tree
        run: |
          set -euo pipefail
          patch --strip=1 --batch --forward < /tmp/final-audit.patch
          rm -rf .github/final-audit-patch .github/final-audit-payload
          rm -f .github/workflows/apply-final-repository-audit.yml

          python3 /tmp/audit-additions/runtime/document_symbols.py
          cp -a /tmp/audit-additions/payload/. .
          python3 tools/ci/sync_package_metadata.py --write
          python3 tools/ci/generate_package_reference.py --write

          rm -rf .github/final-audit-additions
          rm -f .github/final-audit-trigger .github/workflows/final-audit-orchestrator.yml

      - name: Verify exact reviewed source manifest
        env:
          EXPECTED_FILES: "1667"
          EXPECTED_MANIFEST_SHA256: 0f7870b02a5958852f63d0a26d9a43c8da3b0d37922868d54da523e41c7bb93d
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import stat

          root = Path('.')
          excluded = {'.git', '.pytest_cache', '__pycache__'}
          entries = []
          for path in sorted(root.rglob('*')):
              relative = path.relative_to(root)
              if any(part in excluded for part in relative.parts) or not path.is_file():
                  continue
              mode = '755' if path.stat().st_mode & stat.S_IXUSR else '644'
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              entries.append(f'{mode} {digest} {relative.as_posix()}')
          manifest = ('\n'.join(entries) + '\n').encode()
          actual = hashlib.sha256(manifest).hexdigest()
          expected_files = int(os.environ['EXPECTED_FILES'])
          expected_digest = os.environ['EXPECTED_MANIFEST_SHA256']
          if len(entries) != expected_files or actual != expected_digest:
              raise SystemExit(
                  f'source manifest mismatch: files={len(entries)} sha256={actual}; '
                  f'expected files={expected_files} sha256={expected_digest}'
              )
          print(f'Verified exact source manifest: {len(entries)} files, sha256={actual}')
          PY

      - name: Install pinned validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.1.1 requests==2.34.2 ruff==0.15.22

      - name: Validate exact resulting tree
        run: |
          set -euo pipefail
          python3 tools/ci/pin_supply_chain.py --check
          python3 tools/ci/normalize_package_sources.py
          python3 tools/ci/check_package_collisions.py
          python3 tools/ci/check_repository_quality.py
          python3 tools/ci/sync_repository_facts.py
          python3 tools/ci/sync_package_metadata.py
          python3 tools/ci/generate_package_reference.py
          python3 tools/ci/manage_module_docstrings.py
          python3 tools/ci/check_python_syntax.py
          python3 tools/ci/full_repository_audit.py --fail-on low --output /tmp/repository-audit.json
          python3 -m unittest discover -s tests -p 'test_ci_*.py' -v
          pytest -q .github/tests
          pytest -q */tests
          python3 .github/scripts/build_repository_mkps.py \
            --repository . \
            --output /tmp/repository-mkps \
            --packaged-version 2.5.0p9

      - name: Publish one clean audited commit
        env:
          BRANCH: agent/final-repository-completion-audit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'audit: complete repository validation and hardening' | \
            git commit-tree "$tree" -p origin/master)
          git push \
            --force-with-lease="refs/heads/${BRANCH}:${AUDIT_SHA}" \
            origin "${commit}:refs/heads/${BRANCH}"
          printf 'FINAL_AUDIT_SHA=%s\n' "$commit" >> "$GITHUB_ENV"
          printf 'Published clean audit commit %s\n' "$commit"

      - name: Dispatch exact-head repository validation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: agent/final-repository-completion-audit
        run: |
          set -euo pipefail
          for workflow in repository-guard.yml repository-mkp-ci.yml; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              --data "{\"ref\":\"${BRANCH}\"}"
          done
          printf 'Dispatched full validation for %s\n' "$FINAL_AUDIT_SHA"
