name: Fix manifest-derived release inventory

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/fix-release-inventory.yml"

permissions:
  contents: write

concurrency:
  group: fix-release-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/repository-wide-security-documentation-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned test tools
        run: python3 -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Replace fixed release count with canonical discovery
        env:
          EXPECTED_PARENT: 655d6db2b6929d5a5ea84e1c80091d5320863d82
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          import json
          from pathlib import Path

          script = Path(".github/scripts/prepare_repository_mkp_release.py")
          text = script.read_text(encoding="utf-8")
          read_config = '''def _read_config(path: Path) -> dict[str, Any]:
              config = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(config, dict):
                  raise ValueError(f"{path}: release configuration must be an object")
              return config
          '''.replace("          ", "")
          discovery = read_config + '''

          def _discover_info_paths(repository: Path) -> list[Path]:
              """Discover active packages exclusively from canonical manifests."""
              info_paths = sorted(
                  path for path in repository.glob("*/src/info") if path.is_file()
              )
              if not info_paths:
                  raise ValueError(f"{repository}: no active package manifests found")
              return info_paths
          '''.replace("          ", "")
          if read_config not in text:
              raise SystemExit("configuration helper marker missing")
          text = text.replace(read_config, discovery, 1)
          old_inventory = '''    info_paths = sorted(repository.glob("*/src/info"))
              expected = int(config["expected_package_count"])
              if len(info_paths) != expected:
                  raise SystemExit(f"Expected {expected} active packages, found {len(info_paths)}")
          '''.replace("              ", "")
          new_inventory = "    info_paths = _discover_info_paths(repository)\n"
          if old_inventory not in text:
              raise SystemExit("fixed inventory marker missing")
          script.write_text(text.replace(old_inventory, new_inventory, 1), encoding="utf-8")

          config_path = Path(".github/repository-mkp-release.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          removed = config.pop("expected_package_count", None)
          if removed != 95:
              raise SystemExit(f"unexpected prior package count: {removed!r}")
          config_path.write_text(
              json.dumps(config, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          tests = Path(".github/tests/test_repository_release.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "\ndef test_alertmanager_release_keeps_custom_rule_namespace(tmp_path: Path) -> None:\n"
          addition = '''

          def test_release_inventory_is_derived_from_canonical_manifests(
              tmp_path: Path,
          ) -> None:
              prepare = _load(
                  "prepare_repository_mkp_release_inventory",
                  REPOSITORY / ".github/scripts/prepare_repository_mkp_release.py",
              )
              for name in ("alpha", "beta"):
                  _write_manifest(tmp_path / name, _minimal_manifest(name))

              discovered = prepare._discover_info_paths(tmp_path)

              assert [path.parent.parent.name for path in discovered] == ["alpha", "beta"]
              with pytest.raises(ValueError, match="no active package manifests"):
                  prepare._discover_info_paths(tmp_path / "empty")
          '''.replace("          ", "")
          if marker not in test_text:
              raise SystemExit("release test insertion marker missing")
          tests.write_text(test_text.replace(marker, addition + marker, 1), encoding="utf-8")
          PY

      - name: Validate release inventory correction
        run: |
          set -euo pipefail
          python3 -m pytest -q .github/tests/test_repository_release.py
          temp_repository="$(mktemp -d)"
          cp -a . "$temp_repository/repository"
          python3 .github/scripts/prepare_repository_mkp_release.py \
            --repository "$temp_repository/repository"
          test "$(find "$temp_repository/repository" -mindepth 2 -maxdepth 3 -path '*/src/info' -type f | wc -l)" -eq 97
          rm -rf "$temp_repository"

      - name: Create validated candidate
        run: |
          set -euo pipefail
          rm .github/workflows/fix-release-inventory.yml
          python3 tools/ci/pin_supply_chain.py --check
          python3 tools/ci/sync_repository_facts.py
          python3 tools/ci/sync_package_metadata.py
          python3 tools/ci/generate_package_reference.py
          python3 tools/ci/manage_module_docstrings.py
          python3 tools/ci/check_python_syntax.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf .pytest_cache
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: derive package inventory from canonical manifests"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse 'HEAD^{tree}')"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
